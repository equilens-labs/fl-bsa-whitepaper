
name: latex-build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: latex-build-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  release-template-smoke:
    name: release-template-smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Record exact release-template source commit
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          test "$(git rev-parse "${commit}^{commit}")" = "$commit"
          echo "BUILD_COMMIT=${commit}" >> "$GITHUB_ENV"
      - name: Set up Python for release template
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install release-template Python deps
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          python -m pip install --require-hashes -r requirements-ci-linux-x86_64.lock
      - name: Ensure release-template PDF text tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mupdf-tools poppler-utils
          test "$(dpkg-query -W -f='${Version}' mupdf-tools)" = "1.23.10+ds1-1build3"
          test "$(/usr/bin/mutool -v 2>&1)" = "mutool version 1.23.10"
      - name: Generate release-template smoke inputs
        shell: bash
        run: |
          set -euo pipefail
          make release-assets
          python3 - <<'PY'
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, "scripts")
          from release_whitepaper import write_identity_tex

          identity = {
              "release": {"tag": "v0.0.0-ci-smoke"},
              "product": {
                  "commit_sha": "a" * 40,
                  "run_id": "12345",
                  "run_attempt": "1",
                  "generator_backend_id": "ci_release_template_smoke",
              },
              "intake": {"snapshot_id": "b" * 64, "bundle_sha256": "c" * 64},
              "whitepaper": {
                  "commit_sha": os.environ["BUILD_COMMIT"],
                  "run_id": "1",
                  "run_attempt": "1",
              },
          }
          write_identity_tex(identity, Path("release/includes/release_identity.tex"))
          PY
      - name: Compile release template smoke
        uses: xu-cheng/latex-action@e2f99d4b3685b0da93f97e1b86ad8fab81105098 # v3.3.0
        with:
          root_file: release/main.tex
          docker_image: ghcr.io/xu-cheng/texlive-full@sha256:d9bfb267e3e3f5e0820ca86e867ee59ebb133fc29561bb28677d9b5a1a9e84ff
          work_in_root_file_dir: false
          pre_compile: |
            export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
            export FORCE_SOURCE_DATE=1
            export TZ=UTC
            test "$SOURCE_DATE_EPOCH" -gt 0
      - name: Canonicalize release template PDF bytes
        run: python3 scripts/canonicalize_release_pdf.py main.pdf
      - name: Verify release template layout
        run: python3 scripts/check_release_layout.py main.log --max-overfull-pt 2
      - name: Verify release template PDF is passive
        run: python3 scripts/check_release_pdf_passive.py main.pdf
      - name: Verify release template smoke identity and marker
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_pdf_release_identity.py \
            --product-tag v0.0.0-ci-smoke \
            --product-sha aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --evidence-run-id 12345 \
            --evidence-run-attempt 1 \
            --generator-backend-id ci_release_template_smoke \
            --whitepaper-sha "$BUILD_COMMIT" \
            --whitepaper-run-id 1 \
            --whitepaper-run-attempt 1 \
            --intake-snapshot-id bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
            --intake-bundle-sha256 cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc \
            --require-release-claims \
            main.pdf
          hits="$(pdftotext main.pdf - | grep -F -c 'DEMO / EVALUATION ONLY' || true)"
          if ! [[ "$hits" =~ ^[1-9][0-9]*$ ]]; then
            echo "release template smoke PDF is missing the demo/evaluation marker" >&2
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Stable-v5 validation resolves the pinned historical intake commit/tree.
          fetch-depth: 0
          # A pull_request workflow otherwise checks out GitHub's synthetic merge
          # commit, producing an artifact whose embedded identity is not the reviewed
          # PR head. Push and workflow_dispatch continue to use github.sha.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Record exact source commit
        id: source
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          test "$(git rev-parse "${commit}^{commit}")" = "$commit"
          echo "BUILD_COMMIT=${commit}" >> "$GITHUB_ENV"
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install Python deps
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          python -m pip install --require-hashes -r requirements-ci-linux-x86_64.lock
      - name: Ensure pdftotext available
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Run workflow contract tests
        run: |
          make test
      - name: Generate TeX macros from pinned intake (strict)
        run: |
          set -euo pipefail
          make assets
          git diff --exit-code -- config evidence figures includes intake
      - name: Enable public demo watermark
        run: |
          mkdir -p includes
          cp profiles/publication_profile.candidate.tex includes/publication_profile.local.tex
      - name: Set reproducible source epoch
        shell: bash
        run: |
          set -euo pipefail
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
          echo "FORCE_SOURCE_DATE=1" >> "$GITHUB_ENV"
          echo "TZ=UTC" >> "$GITHUB_ENV"
      - name: Build and verify companion evidence identity
        run: |
          set -euo pipefail
          mkdir -p dist
          python scripts/build_companion_bundle.py \
            --repo-root . \
            --output dist/fl-bsa-v5.0.1-companion-evidence.zip
          python scripts/verify_companion_bundle.py \
            --expected-utility-sha256 \
            2b05a4a2b7ce2d798b9156ed5f837efe890ee87e4f5e914497724802636e4595 \
            --expected-gold-manifest-sha256 \
            353cd77907a5b5b0f64534ce6e5b00defeb872f5a8585aec43006ec24f96e073 \
            --expected-gold-index-sha256 \
            9ffb2c04a95f428f068d471732c7d9ed1e27a16d553749c2ec828907fbe9166c \
            --expected-gold-summary-sha256 \
            4339828263ce4cb3b81353f1fdb3e11ae5c99aeaebe9b3477be18dfe5a436a63 \
            dist/fl-bsa-v5.0.1-companion-evidence.zip
          python scripts/gen_publication_identity.py \
            --require-clean \
            --repo-root . \
            --companion dist/fl-bsa-v5.0.1-companion-evidence.zip \
            --output includes/publication_identity.tex
      - name: Compile LaTeX
        uses: xu-cheng/latex-action@e2f99d4b3685b0da93f97e1b86ad8fab81105098 # v3.3.0
        with:
          root_file: main.tex
          docker_image: ghcr.io/xu-cheng/texlive-full@sha256:d9bfb267e3e3f5e0820ca86e867ee59ebb133fc29561bb28677d9b5a1a9e84ff
          pre_compile: |
            export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
            export FORCE_SOURCE_DATE=1
            export TZ=UTC
            test "$SOURCE_DATE_EPOCH" -gt 0
            test "$FORCE_SOURCE_DATE" = 1
            test "$TZ" = UTC
          latexmk_use_xelatex: false
      - name: Assert exact archival release identity in PDF
        run: |
          python3 scripts/verify_pdf_release_identity.py \
            --product-tag v5.0.1 \
            --product-sha cc32b3a8d13cb75419b0dec1d4b9bdf5a3eb90c2 \
            --evidence-run-id 30765888408 \
            --whitepaper-sha "$BUILD_COMMIT" \
            main.pdf
      - name: Assert public demo watermark in PDF
        run: |
          set -euo pipefail
          hits="$(pdftotext main.pdf - | grep -F -c 'DEMO / EVALUATION ONLY' || true)"
          if [ "$hits" -ne 1 ]; then
            echo "whitepaper.pdf must contain exactly one extractable DEMO / EVALUATION ONLY cover marker; found ${hits}." >&2
            exit 1
          fi
          echo "Found DEMO / EVALUATION ONLY marker ${hits} time(s)."
      - name: Assert reviewed PDF tag structure
        run: |
          python3 scripts/check_pdf_tag_structure.py \
            --expected-header-cells 26 \
            --expected-figures 7 \
            main.pdf
      - name: Preflight PDF/UA structure with pinned official veraPDF
        run: |
          make ua-preflight
      - name: Prepare artifacts directory
        run: |
          mkdir -p dist
          cp main.pdf dist/whitepaper.pdf
          cp main.pdf dist/fl-bsa-v5.0.1-characterization-candidate.pdf
      - name: Upload PDF artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fl-bsa-v5.0.1-archival-whitepaper-${{ github.run_attempt }}
          path: |
            dist/fl-bsa-v5.0.1-characterization-candidate.pdf
            dist/fl-bsa-v5.0.1-companion-evidence.zip
      - name: Package arXiv source
        run: |
          bash scripts/arxiv_pack.sh
      - name: Build stable-v5 compatibility intake
        if: github.event_name == 'workflow_dispatch'
        run: |
          python -S scripts/intake_anchor.py export \
            --anchor baselines/stable-v5-characterization.json \
            --repo-root . \
            --output dist/stable-v5-intake-compatibility.zip
      - name: Write stable-v5 publication manifest
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            git status --short >&2
            echo "Tracked publication sources changed during the build; refusing to label them as the checked-out commit." >&2
            exit 1
          fi
          python scripts/build_publication_manifest.py \
            --whitepaper-commit "$BUILD_COMMIT" \
            --publication-status candidate_not_published \
            --companion dist/fl-bsa-v5.0.1-companion-evidence.zip \
            --compatibility-intake dist/stable-v5-intake-compatibility.zip
      - name: Upload arXiv source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fl-bsa-v5.0.1-archival-arxiv-source-${{ github.run_attempt }}
          path: dist/whitepaper_arxiv_source.zip
      - name: Upload stable-v5 publication candidate
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stable-v5-publication-candidate-${{ github.run_attempt }}
          path: |
            dist/publication-manifest.json
            dist/stable-v5-intake-compatibility.zip
            dist/fl-bsa-v5.0.1-companion-evidence.zip
